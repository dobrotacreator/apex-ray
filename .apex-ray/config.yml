review:
  local_data:
    root: git_common
  base: main
  ignore:
    - "**/*.lock"
    - "**/generated/**"
    - ".venv/**"
    - ".ci-smoke-venv/**"
    - ".pytest_cache/**"
    - ".ruff_cache/**"
    - ".codegraph/**"
    - ".code-review-graph/**"
    - "build/**"
    - "dist/**"
    - "site/**"
    - "analyzer-runtimes/typescript/node_modules/**"
    - "analyzer-runtimes/typescript/dist/**"
    - "analyzer-runtimes/typescript/dist-test/**"
    - ".apex-ray/cache/**"
    - ".apex-ray/telemetry/**"
    - ".apex-ray/reports/**"
    - ".apex-ray/eval/telemetry/**"
    - ".apex-ray/eval/runs/**"
    - ".apex-ray/evals/runs/**"
  rule_paths:
    - .apex-ray/rules
  memory:
    enabled: true
    paths:
      - .apex-ray/memory
  llm:
    enabled: true
    provider: codex_cli
    profiles:
      cheap:
        provider: codex_cli
        model: gpt-5.3-codex-spark
        effort: xhigh
      strong:
        provider: codex_cli
        model: gpt-5.4
        effort: medium
      frontier:
        provider: codex_cli
        model: gpt-5.5
        effort: medium
    routing:
      review_profile: cheap
      verify_profile: strong
      escalated_review_profile: frontier
      escalated_verify_profile: frontier
      escalate_review_when:
        risk:
          - auth
          - shell
          - persistence
          - public_api
          - external_io
          - migration
        rule_severity:
          - high
          - critical
        strict_rule: true
        pack_truncated: true
      escalate_verify_when:
        finding_severity:
          - high
          - critical
    coverage_mode: balanced
    max_packs: 96
    max_deep_packs: 64
    max_input_tokens: 450000
    timeout_seconds: 900
    jobs: 4
    verify: true
    cache_dir: ${local_data}/cache/llm
  telemetry:
    enabled: true
    path: ${local_data}/telemetry/review-runs.jsonl
  reports:
    archive: true
    archive_dir: ${local_data}/reports/runs
    retention: 20
  gates:
    pre_push:
      enabled: true
      min_finding_severity: high
      require_verified_findings: true
      fail_on_quality_gate: true
      fail_on_partial_severity: critical
      max_stdout_findings: 10
      stdout_format: agent
      auto_followup_p0: true
      progress: auto
      progress_interval_seconds: 5
      incremental_retry:
        enabled: true
