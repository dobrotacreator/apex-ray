name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# CI opts into the upcoming GitHub Actions Node 24 runtime early so third-party
# JavaScript actions break here before GitHub changes the default runner runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: analyzer-runtimes/typescript/package-lock.json

      - uses: astral-sh/setup-uv@v7

      - name: Install TypeScript analyzer dependencies
        working-directory: analyzer-runtimes/typescript
        run: npm ci

      - name: Typecheck TypeScript analyzer
        working-directory: analyzer-runtimes/typescript
        run: npm run typecheck

      - name: Test TypeScript analyzer
        working-directory: analyzer-runtimes/typescript
        run: npm test

      - name: Measure TypeScript analyzer coverage
        working-directory: analyzer-runtimes/typescript
        run: npm run coverage

      - name: Install Python dependencies
        run: uv sync --locked --all-groups

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Typecheck Python
        run: uv run pyright

      - name: Run Python tests with coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report -m

      - name: Build package
        run: uv build --sdist --wheel

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Set up pinned Flutter SDK for installed-wheel smoke
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
          pub-cache: true

      - name: Smoke test installed wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv venv .ci-smoke-venv
          uv pip install --python .ci-smoke-venv/bin/python "$wheel"
          .ci-smoke-venv/bin/apex-ray --version
          tmpdir="$(mktemp -d)"
          doctor_output="$(cd "$tmpdir" && "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/apex-ray" doctor)"
          echo "$doctor_output"
          grep -q "Python analyzer available: true" <<<"$doctor_output"
          grep -q "TypeScript analyzer built: true" <<<"$doctor_output"
          ts_reviewdir="$(mktemp -d)"
          cd "$ts_reviewdir"
          git init
          git config user.email "apex@example.test"
          git config user.name "Apex Test"
          mkdir -p src
          printf '{"compilerOptions":{"target":"ES2022"},"include":["src/**/*.ts"]}\n' > tsconfig.json
          printf 'export function total(price: number, quantity: number): number {\n  return price * quantity;\n}\n' > src/cart.ts
          git add .
          git commit -m "initial"
          printf 'export function total(price: number, quantity: number): number {\n  return price;\n}\n' > src/cart.ts
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/apex-ray" review --worktree --no-llm --output review.md --json review.json
          test -s review.md
          test -s review.json
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("review.json").read_text(encoding="utf-8"))
          assert report["analyzer_results"], "expected bundled TypeScript analyzer results"
          warnings = "\n".join(
              warning
              for analyzer_result in report["analyzer_results"]
              for warning in analyzer_result.get("warnings", [])
          )
          assert "TypeScript analyzer unavailable" not in warnings
          assert any(
              symbol.get("changed_symbols")
              for analyzer_result in report["analyzer_results"]
              for symbol in analyzer_result.get("files", [])
          ), "expected changed symbols from bundled TypeScript analyzer"
          PY
          py_reviewdir="$(mktemp -d)"
          cd "$py_reviewdir"
          git init
          git config user.email "apex@example.test"
          git config user.name "Apex Test"
          mkdir -p src
          cat > src/adapter.py <<'PYCODE'
          class ResourceClient:
              def __init__(self, client):
                  self._client = client

              async def send_resource(self, payload):
                  response = await self._client.post("/resources", json=payload)
                  return response
          PYCODE
          git add .
          git commit -m "initial"
          cat > src/adapter.py <<'PYCODE'
          class ResourceClient:
              def __init__(self, client):
                  self._client = client

              async def send_resource(self, payload):
                  response = await self._client.post("/resources", json=payload, timeout=5.0)
                  return response
          PYCODE
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/apex-ray" review --worktree --no-llm --output python-review.md --json python-review.json
          test -s python-review.md
          test -s python-review.json
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("python-review.json").read_text(encoding="utf-8"))
          python_results = [
              analyzer_result
              for analyzer_result in report["analyzer_results"]
              if analyzer_result.get("language") == "python"
          ]
          assert python_results, "expected Python analyzer results"
          warnings = "\n".join(
              warning
              for analyzer_result in python_results
              for warning in analyzer_result.get("warnings", [])
          )
          assert "Python analyzer failed" not in warnings
          assert any(
              symbol.get("changed_symbols")
              for analyzer_result in python_results
              for symbol in analyzer_result.get("files", [])
          ), "expected changed symbols from Python analyzer"
          assert any(
              "external I/O call" in metadata.get("text", "")
              for pack in report["context_packs"]
              for metadata in pack.get("metadata", [])
          ), "expected Python boundary metadata in context pack"
          PY
          go_reviewdir="$(mktemp -d)"
          cd "$go_reviewdir"
          git init
          git config user.email "apex@example.test"
          git config user.name "Apex Test"
          mkdir -p internal/auth internal/api
          cat > go.mod <<'GOMOD'
          module example.com/review

          go 1.24
          GOMOD
          cat > internal/auth/service.go <<'GOCODE'
          package auth

          import (
              "context"
              "fmt"
          )

          type Repository interface {
              Save(context.Context, string) error
          }

          type Service struct {
              repo Repository
          }

          func (s *Service) Authorize(ctx context.Context, id string) error {
              if err := s.repo.Save(ctx, id); err != nil {
                  return fmt.Errorf("save auth: %w", err)
              }
              return nil
          }
          GOCODE
          cat > internal/api/handler.go <<'GOCODE'
          package api

          import (
              "net/http"

              "example.com/review/internal/auth"
          )

          func Register(mux *http.ServeMux, svc *auth.Service) {
              mux.HandleFunc("/resource", func(w http.ResponseWriter, r *http.Request) {
                  _ = svc.Authorize(r.Context(), "resource-id")
              })
          }
          GOCODE
          git add .
          git commit -m "initial"
          perl -0pi -e 's/return nil/return fmt.Errorf("unauthorized: %w", context.Canceled)/' internal/auth/service.go
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/python" - <<'PY'
          from apex_ray.analyzers import go_analyzer_runtime_dir

          runtime = go_analyzer_runtime_dir()
          assert runtime.name == "go", runtime
          assert runtime.parent.name == "_bundled", runtime
          assert (runtime / "go.mod").exists(), runtime
          assert (runtime / "cmd" / "apex-ray-go-analyzer" / "main.go").exists(), runtime
          PY
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/apex-ray" review --worktree --no-llm --output go-review.md --json go-review.json
          test -s go-review.md
          test -s go-review.json
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("go-review.json").read_text(encoding="utf-8"))
          go_results = [
              analyzer_result
              for analyzer_result in report["analyzer_results"]
              if analyzer_result.get("language") == "go"
          ]
          assert go_results, "expected Go analyzer results from installed wheel"
          warnings = "\n".join(
              warning
              for analyzer_result in go_results
              for warning in analyzer_result.get("warnings", [])
          )
          assert "Go analyzer unavailable" not in warnings
          assert any(
              symbol.get("changedSymbols") or symbol.get("changed_symbols")
              for analyzer_result in go_results
              for symbol in analyzer_result.get("files", [])
          ), "expected changed symbols from bundled Go analyzer"
          assert any(
              reference.get("file") == "internal/api/handler.go"
              for pack in report["context_packs"]
              for reference in pack.get("references", [])
          ), "expected typed Go reference in context pack"
          assert any(
              "error wrapping" in metadata.get("text", "")
              for pack in report["context_packs"]
              for metadata in pack.get("metadata", [])
          ), "expected Go boundary metadata in context pack"
          PY
          dart_reviewdir="$(mktemp -d)"
          cd "$dart_reviewdir"
          git init
          git config user.email "apex@example.test"
          git config user.name "Apex Test"
          mkdir -p .apex-ray lib test packages/counter_core/lib/src
          printf '.dart_tool/\nbuild/\n' > .gitignore
          cat > .apex-ray/config.yml <<'YAML'
          review:
            analyzer:
              dart:
                plugins: false
            llm:
              enabled: false
          YAML
          cat > pubspec.yaml <<'YAML'
          name: apex_ray_flutter_smoke
          publish_to: none
          environment:
            sdk: ">=3.9.0 <4.0.0"
          workspace:
            - packages/counter_core
          dependencies:
            flutter:
              sdk: flutter
            counter_core: ^1.0.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
          YAML
          cat > packages/counter_core/pubspec.yaml <<'YAML'
          name: counter_core
          version: 1.0.0
          publish_to: none
          resolution: workspace
          environment:
            sdk: ">=3.9.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
          YAML
          cat > packages/counter_core/lib/counter.dart <<'DART'
          import 'package:flutter/foundation.dart';

          part 'src/counter.g.dart';

          class CounterController extends ChangeNotifier {
            int _value = 0;

            int get value => _value;

            void increment() {
              _value += 1;
              notifyListeners();
            }
          }
          DART
          cat > packages/counter_core/lib/src/counter.g.dart <<'DART'
          part of '../counter.dart';

          // CI_GENERATED_SECRET_DO_NOT_PROMPT
          extension GeneratedCounterReplay on CounterController {
            void replayGenerated() {
              increment();
            }
          }
          DART
          cat > lib/counter_consumer.dart <<'DART'
          import 'package:counter_core/counter.dart';

          class CounterConsumer {
            CounterConsumer(this.controller);

            final CounterController controller;

            void increment() => controller.increment();
          }
          DART
          cat > test/counter_test.dart <<'DART'
          import 'package:apex_ray_flutter_smoke/counter_consumer.dart';
          import 'package:counter_core/counter.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('increments through a local package dependency', () {
              final controller = CounterController();
              final consumer = CounterConsumer(controller);

              consumer.increment();
              controller.increment();

              expect(controller.value, 2);
            });
          }
          DART
          flutter pub get
          git add .
          git commit -m "initial"
          perl -0pi -e 's/_value \+= 1;/_value += 2;/' packages/counter_core/lib/counter.dart
          doctor_output="$("$GITHUB_WORKSPACE/.ci-smoke-venv/bin/apex-ray" doctor)"
          echo "$doctor_output"
          grep -q "Detected languages: dart" <<<"$doctor_output"
          grep -q "Package managers: pub" <<<"$doctor_output"
          grep -q "Framework hints: flutter" <<<"$doctor_output"
          grep -q "Dart analyzer available: true" <<<"$doctor_output"
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/apex-ray" review --worktree --no-llm --output dart-review.md --json dart-review.json
          test -s dart-review.md
          test -s dart-review.json
          "$GITHUB_WORKSPACE/.ci-smoke-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("dart-review.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          dart_results = [
              analyzer_result
              for analyzer_result in report["analyzer_results"]
              if analyzer_result.get("language") == "dart"
          ]
          assert dart_results, "expected Dart analyzer results from installed wheel"
          warnings = "\n".join(
              warning
              for analyzer_result in dart_results
              for warning in analyzer_result.get("warnings", [])
          )
          assert "Dart analyzer unavailable" not in warnings
          assert "Unable to start Dart LSP server" not in warnings
          changed_file = next(
              analyzer_file
              for analyzer_result in dart_results
              for analyzer_file in analyzer_result.get("files", [])
              if analyzer_file.get("path") == "packages/counter_core/lib/counter.dart"
          )
          assert changed_file.get("changed_symbols"), (
              "expected changed symbols from the live Dart Analysis Server for the nested local package"
          )
          references = {
              reference.get("file")
              for symbol in changed_file.get("changed_symbols", [])
              for reference in symbol.get("references", [])
          }
          assert "lib/counter_consumer.dart" in references, (
              "expected a semantic reference from the unchanged reverse-dependent root package"
          )
          assert "test/counter_test.dart" in references, (
              "expected a semantic reference from the root Flutter test across the package boundary"
          )
          assert "test/counter_test.dart" in changed_file.get("related_tests", []), (
              "expected the cross-package semantic Flutter test relationship"
          )
          serialized_report = report_path.read_text(encoding="utf-8")
          assert "CI_GENERATED_SECRET_DO_NOT_PROMPT" not in serialized_report, (
              "generated Dart source must not enter report or prompt context"
          )
          assert "packages/counter_core/lib/src/counter.g.dart" not in serialized_report, (
              "generated Dart source from the nested package must stay absent"
          )
          assert all(
              not snippet.get("file", "").endswith(".g.dart")
              for pack in report["context_packs"]
              for key in (
                  "changed_snippets",
                  "reference_snippets",
                  "callee_snippets",
                  "contract_snippets",
                  "metadata_snippets",
                  "related_test_snippets",
              )
              for snippet in pack.get(key, [])
          ), "generated Dart snippets must not enter context packs"
          PY
